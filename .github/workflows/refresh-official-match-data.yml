name: Refresh official match data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-match-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh public official sources
        run: python scripts/refresh_official_matches.py

      - name: Publish changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/official-matches.json
          if git diff --cached --quiet; then
            echo "Official match data did not change."
            exit 0
          fi
          git commit -m "Refresh official match data"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
